<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans selection:bg-amber-500 selection:text-white transition-all duration-500 bg-cover bg-center bg-fixed">

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Canva / Créateur de Thème -->
    <div id="theme-canvas-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-stone-950 border border-amber-500/40 rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-amber-400"><i class="fa-solid fa-paintbrush mr-2"></i>Thème Personnalisé (Canva / Image Web)</h3>
                <button onclick="toggleModal('theme-canvas-modal', false)" class="text-amber-200/70 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-amber-200 mb-1">Nom du thème</label>
                    <input type="text" id="canvas-theme-name" placeholder="Ex: Fond Canva Automne" class="w-full px-3 py-2 bg-stone-900 border border-amber-900/40 rounded-xl text-amber-100">
                </div>
                <div>
                    <label class="block font-bold text-amber-200 mb-1">URL de l'image de fond</label>
                    <input type="url" id="canvas-theme-bg" placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 bg-stone-900 border border-amber-900/40 rounded-xl text-amber-100">
                </div>
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-amber-900/40">
                <button onclick="window.open('https://www.canva.com/fr_fr/', '_blank')" class="px-3 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-external-link"></i> Ouvrir Canva.com
                </button>
                <div class="flex gap-2">
                    <button onclick="toggleModal('theme-canvas-modal', false)" class="px-4 py-2 bg-stone-900 text-amber-200 rounded-xl text-xs">Annuler</button>
                    <button onclick="saveCanvasTheme()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Enregistrer le Thème</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm bg-stone-900 border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl" id="toast-icon"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
            <div id="toast-action" class="pt-1"></div>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const SB_URL = 'https://jbenyehthydjmahpoisd.supabase.co';
        const SB_KEY = 'sb_publishable_m3b9h4bgzdTJrgFLIzSJXQ_Og-vBeOa';

        let sb = null;
        try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch(e){}

        const DB = {
            async get(k, fb) {
                try {
                    if (sb) {
                        let { data } = await sb.from('tmcv_data').select('value').eq('key', k).maybeSingle();
                        if (data?.value) return data.value;
                    }
                } catch(e){}
                let item = localStorage.getItem('leqg_' + k);
                return item ? JSON.parse(item) : fb;
            },
            async set(k, val) {
                try { if (sb) await sb.from('tmcv_data').upsert({ key: k, value: val }); } catch(e){}
                localStorage.setItem('leqg_' + k, JSON.stringify(val));
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeQuizId: null
        };

        async function init() {
            if (!await DB.get('users', null)) {
                await DB.set('users', [
                    { username: 'admin', password: 'admin20', role: 'admin', status: 'active', avatar: '🏰', mustChangePass: true, birthday: '2009-03-26' }
                ]);
            }
            if (!await DB.get('messages', null)) DB.set('messages', [{ id: 1, type: 'general', sender: 'admin', text: 'Bienvenue sur LE QG !', time: 'Aujourd\'hui' }]);
            if (!await DB.get('appreciations', null)) DB.set('appreciations', {});
            if (!await DB.get('custom_pages', null)) DB.set('custom_pages', []);
            if (!await DB.get('hidden_pages', null)) DB.set('hidden_pages', []);
            if (!await DB.get('custom_themes', null)) DB.set('custom_themes', []);
            if (!await DB.get('revision_sheets', null)) DB.set('revision_sheets', []);
            if (!await DB.get('exam_subjects', null)) DB.set('exam_subjects', []);
            if (!await DB.get('admin_calendar', null)) DB.set('admin_calendar', []);
            if (!await DB.get('quizzes', null)) DB.set('quizzes', []);
            if (!await DB.get('quiz_submissions', null)) DB.set('quiz_submissions', []);
            if (!await DB.get('orientation_links', null)) DB.set('orientation_links', []);
            if (!await DB.get('home_qr_url', null)) DB.set('home_qr_url', window.location.href);

            applyTheme(await DB.get('theme', 'autumn'));

            setInterval(showRefreshReminder, 600000);
            setInterval(checkAlarms, 30000);
            render();
        }

        function showRefreshReminder() {
            let user = getCurrentUser();
            if (!user) return;
            document.getElementById('toast-title').textContent = "Mise à jour disponible 🔄";
            document.getElementById('toast-msg').textContent = "Pense à actualiser ta page pour voir les dernières nouveautés et messages !";
            document.getElementById('toast-action').innerHTML = `<button onclick="location.reload()" class="px-3 py-1 bg-amber-500 text-black font-bold rounded-lg text-xs">Actualiser maintenant</button>`;
            document.getElementById('global-notification-toast').classList.remove('hidden');
        }

        async function checkAlarms() {
            let user = getCurrentUser();
            if (!user) return;
            let now = new Date();
            if (now.getHours() === 9 && now.getMinutes() === 0 && localStorage.getItem('leqg_cantine') !== now.toDateString()) {
                showToast("Rappel Cantine 🍽️", "Pense à réserver ta cantine à la borne du hall !");
                localStorage.setItem('leqg_cantine', now.toDateString());
            }

            let adminEvents = await DB.get('admin_calendar', []);
            let personalEvents = user.personalCalendar || [];
            let allEvs = [...adminEvents, ...personalEvents];
            let todayStr = now.toISOString().split('T')[0];
            allEvs.forEach(ev => {
                if(ev.date === todayStr && localStorage.getItem('notif_'+ev.id) !== todayStr) {
                    showToast("Rappel Événement 📅", ev.title);
                    localStorage.setItem('notif_'+ev.id, todayStr);
                }
            });
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('leqg_current_user') || 'null');
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-action').innerHTML = '';
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 7000);
        }

        function toggleModal(id, show) {
            let el = document.getElementById(id);
            if(el) el.classList.toggle('hidden', !show);
        }

        async function applyTheme(theme) {
            let body = document.getElementById('body-theme');
            let custom = (await DB.get('custom_themes', [])).find(t => t.id === theme);
            if (custom) {
                body.style.backgroundImage = `url('${custom.bgUrl}')`;
                window.currentBtnClass = "bg-amber-600 hover:bg-amber-500 text-white rounded-2xl font-bold shadow-lg transition-all p-2.5";
                window.currentCardClass = "bg-stone-950/90 border border-amber-500/40 shadow-2xl rounded-3xl backdrop-blur-md";
                return;
            }
            const themes = {
                christmas: { bg: 'photo-1543589077-47d81606c1bf', btn: 'bg-red-700 text-amber-100', card: 'bg-sky-950/90' },
                summer: { bg: 'photo-1507525428034-b723cf961d3e', btn: 'bg-amber-500 text-blue-950', card: 'bg-blue-950/85' },
                spring: { bg: 'photo-1522383225653-ed111181a951', btn: 'bg-emerald-600 text-white', card: 'bg-emerald-950/85' },
                cyberpunk: { bg: 'photo-1508739773434-c26b3d09e071', btn: 'bg-pink-600 text-white', card: 'bg-purple-950/90' },
                royal: { bg: 'photo-1618005182384-a83a8bd57fbe', btn: 'bg-yellow-600 text-black', card: 'bg-stone-950/90' },
                autumn: { bg: 'photo-1507783592120-a61f55877f6c', btn: 'bg-orange-600 text-amber-100', card: 'bg-stone-950/90' }
            };
            let t = themes[theme] || themes.autumn;
            body.style.backgroundImage = `url('https://images.unsplash.com/${t.bg}?q=80&w=1920&auto=format&fit=crop')`;
            window.currentBtnClass = t.btn + " rounded-2xl font-bold shadow-lg transition-all p-2.5";
            window.currentCardClass = t.card + " border border-amber-900/40 shadow-2xl rounded-3xl backdrop-blur-md";
        }

        async function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-2xl font-bold text-red-400">Compte Désactivé</h1><p class="text-xs text-amber-200/60 mt-2">Ton accès a été temporairement suspendu par un administrateur.</p><button onclick="logout()" class="mt-4 px-5 py-2 bg-amber-900 text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup();
            app.innerHTML = await renderDashboard(user);
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md bg-stone-950/90 border border-amber-800/40 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                <div class="p-4 bg-amber-500/10 text-amber-400 rounded-2xl text-4xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                <h1 class="text-3xl font-black text-white">LE QG</h1>
                <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <input type="text" id="l-user" required placeholder="Identifiant" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <input type="password" id="l-pass" required placeholder="Mot de passe" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <button type="submit" class="w-full py-3.5 ${window.currentBtnClass} text-sm">Se connecter</button>
                </form>
            </div></div>`;
        }

        function renderSetup() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md bg-stone-950/90 border border-amber-800/40 rounded-3xl p-8 shadow-2xl space-y-6">
                <h1 class="text-xl font-bold text-amber-400">Première Connexion</h1>
                <p class="text-xs text-amber-200/70">Merci de définir ton mot de passe personnel ainsi que ta date d'anniversaire.</p>
                <form onsubmit="saveSetup(event)" class="space-y-4">
                    <div><label class="block text-xs text-amber-200 mb-1">Nouveau mot de passe</label><input type="password" id="s-pass" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Date d'anniversaire</label><input type="date" id="s-bday" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <button type="submit" class="w-full py-3.5 ${window.currentBtnClass} text-sm">Valider & Enregistrer</button>
                </form>
            </div></div>`;
        }

        async function renderDashboard(user) {
            let customPages = await DB.get('custom_pages', []);
            let hiddenPages = await DB.get('hidden_pages', []);
            let navs = customPages.filter(p => !hiddenPages.includes('page_' + p.id)).map(p => sbBtn('page_' + p.id, p.title, p.icon || 'file-lines')).join('');

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 sticky top-0 z-40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2 font-black text-amber-400">🏰 LE QG <span class="text-xs text-amber-200/70 font-normal">(${user.username})</span></div>
                    </div>
                    <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border border-amber-900/40">Déconnexion</button>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-72 bg-stone-950/95 border-r border-amber-900/40 transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-5 pt-20 shadow-2xl">
                        <nav class="space-y-1.5 flex-1 overflow-y-auto text-xs">
                            ${!hiddenPages.includes('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                            ${!hiddenPages.includes('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'award') : ''}
                            ${!hiddenPages.includes('avatar') ? sbBtn('avatar', 'Mon Avatar', 'user-pen') : ''}
                            ${!hiddenPages.includes('chat') ? sbBtn('chat', 'Messagerie', 'comments') : ''}
                            ${!hiddenPages.includes('calendar') ? sbBtn('calendar', 'Calendrier & Agenda', 'calendar-days') : ''}
                            ${!hiddenPages.includes('quizzes') ? sbBtn('quizzes', 'Quiz & Progrès', 'brain') : ''}
                            ${!hiddenPages.includes('orientation') ? sbBtn('orientation', 'Orientation', 'compass') : ''}
                            ${!hiddenPages.includes('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                            ${!hiddenPages.includes('exams') ? sbBtn('exams', 'Sujets Bac', 'graduation-cap') : ''}
                            ${!hiddenPages.includes('notes') ? sbBtn('notes', 'Bloc-Notes', 'note-sticky') : ''}
                            ${navs}
                            ${user.role === 'admin' ? sbBtn('gemini', 'Gemini AI', 'sparkles', 'text-sky-400 bg-sky-500/10') : ''}
                            ${user.role === 'admin' ? sbBtn('admin', 'Administration', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                        </nav>
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 md:p-8">${await renderContent(user)}</main>
                </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 border transition-all ${active ? window.currentBtnClass : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon}"></i> ${label}</button>`;
        }

        async function renderContent(user) {
            if (state.tab.startsWith('page_')) {
                let cp = (await DB.get('custom_pages', [])).find(x => x.id == state.tab.replace('page_', ''));
                return cp ? `<div class="max-w-4xl mx-auto ${window.currentCardClass} p-8 space-y-4"><h2 class="text-2xl font-black text-amber-400">${cp.title}</h2><div class="text-amber-100">${cp.content}</div></div>` : '';
            }
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'calendar') return renderCalendar(user);
            if (state.tab === 'quizzes') return renderQuizzes(user);
            if (state.tab === 'orientation') return renderOrientation(user);
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', await DB.get('revision_sheets', []), user);
            if (state.tab === 'exams') return renderDocPage('Sujets Bac & Exercices', await DB.get('exam_subjects', []), user);
            if (state.tab === 'avatar') return `<div class="max-w-md mx-auto ${window.currentCardClass} p-8 text-center space-y-6"><div class="text-7xl">${user.avatar || '🏰'}</div><div class="grid grid-cols-5 gap-3">${['🏰','🎓','🚀','⭐','💻','🦊','⚡','📚','🎯','💡'].map(e=>`<button onclick="updateAvatar('${e}')" class="p-3 bg-stone-900 rounded-2xl text-2xl hover:scale-110 transition-transform">${e}</button>`).join('')}</div></div>`;
            if (state.tab === 'notes') return `<div class="max-w-3xl mx-auto ${window.currentCardClass} p-6 h-[500px] flex flex-col"><h2 class="text-xl font-bold text-amber-400 mb-2">Bloc-Notes</h2><textarea oninput="DB.set('note_'+ '${user.username}', this.value)" class="flex-1 w-full bg-stone-900 border border-amber-900/40 p-4 rounded-2xl text-sm text-amber-100" placeholder="Écris tes notes personnelles ici...">${localStorage.getItem('leqg_note_'+user.username)||''}</textarea></div>`;
            if (state.tab === 'gemini' && user.role === 'admin') return renderGeminiTab();
            if (state.tab === 'admin' && user.role === 'admin') return renderAdmin(user);
            return '';
        }

        async function renderHome() {
            let qrUrl = await DB.get('home_qr_url', window.location.href);
            return `
                <div class="max-w-3xl mx-auto space-y-6 text-center">
                    <div class="${window.currentCardClass} p-8 space-y-4">
                        <h2 class="text-3xl font-black text-white">Bienvenue sur LE QG !</h2>
                        <p class="text-amber-200/80 text-sm">Ton espace collaboratif de lycée.</p>
                    </div>

                    <div class="${window.currentCardClass} p-8 space-y-4">
                        <h3 class="text-xl font-black text-amber-400"><i class="fa-solid fa-mobile-screen-button mr-2"></i>Accès & Installation Smartphone</h3>
                        <p class="text-xs text-amber-200/70">Scanne ce QR Code officiel pour ouvrir l'application directement sur ton smartphone :</p>
                        <div id="home-qrcode-box" class="bg-white p-4 inline-block rounded-2xl shadow-xl border-4 border-amber-500"></div>
                        <p class="text-[10px] text-amber-200/40 truncate">Lien : ${qrUrl}</p>
                    </div>
                </div>
                <script>
                    setTimeout(() => {
                        let box = document.getElementById('home-qrcode-box');
                        if (box && box.innerHTML === '') {
                            new QRCode(box, { text: "${qrUrl}", width: 170, height: 170 });
                        }
                    }, 100);
                <\/script>`;
        }

        async function renderUserAppreciations(user) {
            let allAppreciations = await DB.get('appreciations', {});
            let myApp = allAppreciations[user.username] || { t1: '', t2: '', t3: '', published: false };

            if (!myApp.published && user.role !== 'admin') {
                return `
                    <div class="max-w-2xl mx-auto ${window.currentCardClass} p-8 text-center space-y-4">
                        <i class="fa-solid fa-lock text-4xl text-amber-400"></i>
                        <h2 class="text-2xl font-black text-white">Appréciations Trimestrielles</h2>
                        <p class="text-xs text-amber-200/70">Les appréciations trimestrielles n'ont pas encore été publiées par l'administration.</p>
                    </div>`;
            }

            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="${window.currentCardClass} p-6 space-y-2">
                        <h2 class="text-2xl font-black text-amber-400"><i class="fa-solid fa-award mr-2"></i>Mes Appréciations Trimestrielles</h2>
                        <p class="text-xs text-amber-200/70">Consulte tes appréciations générales trimestrielles renseignées par l'administration.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="${window.currentCardClass} p-5 space-y-2">
                            <h3 class="font-bold text-amber-300 text-sm border-b border-amber-900/40 pb-2">Trimestre 1</h3>
                            <p class="text-xs text-amber-100 italic">${myApp.t1 || 'Aucune appréciation renseignée.'}</p>
                        </div>
                        <div class="${window.currentCardClass} p-5 space-y-2">
                            <h3 class="font-bold text-amber-300 text-sm border-b border-amber-900/40 pb-2">Trimestre 2</h3>
                            <p class="text-xs text-amber-100 italic">${myApp.t2 || 'Aucune appréciation renseignée.'}</p>
                        </div>
                        <div class="${window.currentCardClass} p-5 space-y-2">
                            <h3 class="font-bold text-amber-300 text-sm border-b border-amber-900/40 pb-2">Trimestre 3</h3>
                            <p class="text-xs text-amber-100 italic">${myApp.t3 || 'Aucune appréciation renseignée.'}</p>
                        </div>
                    </div>
                </div>`;
        }

        async function renderChat(user) {
            let allUsers = await DB.get('users', []);
            let messages = await DB.get('messages', []);
            let activeMsgs = state.chatMode === 'general' ? messages.filter(m => m.type === 'general') : messages.filter(m => m.type === 'private' && ((m.sender === user.username && m.recipient === state.targetUser) || (m.sender === state.targetUser && m.recipient === user.username)));

            return `
                <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 h-[600px]">
                    <div class="${window.currentCardClass} p-4 shadow-xl flex flex-col space-y-3">
                        <h3 class="font-bold text-xs uppercase tracking-wider text-amber-200/70">Messagerie</h3>
                        <button onclick="state.chatMode='general';state.targetUser=null;render()" class="w-full text-left p-3.5 rounded-2xl text-xs font-bold transition-all flex items-center gap-3 ${state.chatMode === 'general' ? window.currentBtnClass : 'bg-stone-900 text-amber-200/80'}">
                            <i class="fa-solid fa-bullhorn text-sm"></i> Canal Général
                        </button>
                        <div class="border-t border-amber-900/30 pt-3 flex-1 overflow-y-auto space-y-2">
                            <p class="text-[10px] uppercase font-bold text-amber-200/50 px-1">Membres (MP)</p>

        async function submitQuiz(e, quizId) {
            e.preventDefault();
            let quizzes = await DB.get('quizzes', []);
            let quiz = quizzes.find(q => q.id == quizId);
            if(!quiz) return;

            let score = 0;
            quiz.questions.forEach((q, idx) => {
                let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                if(selected && parseInt(selected.value) === q.correct) {
                    score++;
                }
            });

            let user = getCurrentUser();
            let submission = { username: user.username, quizTitle: quiz.title, score, total: quiz.questions.length, date: new Date().toLocaleDateString() + ' à ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };

            let submissions = await DB.get('quiz_submissions', []);
            submissions.push(submission);
            await DB.set('quiz_submissions', submissions);

            alert(`Quiz terminé ! Ton score est de ${score} / ${quiz.questions.length}`);
            state.activeQuizId = null;
            render();
        }

            if (users.some(u => u.username === username)) return alert("Cet identifiant existe déjà.");

            users.push({

                password,
                role: 'student',
                status: 'active',
                avatar: '🎓',
                mustChangePass: true,
                birthday: ''
            });

            await DB.set('users', users);
            showToast("Succès", `Compte élève pour ${username} créé !`);

            let idx = users.findIndex(u => u.username === username);
            if(idx !== -1) {

                await DB.set('users', users);
                render();

            showToast("Supprimé", `Le compte de ${username} a été supprimé.`);
            render();

            let users = await DB.get('users', []);

            let appreciations = await DB.get('appreciations', {});
            appreciations[username] = {
                t1: document.getElementById(`app_t1_${username}`).value,
                t2: document.getElementById(`app_t2_${username}`).value,
                t3: document.getElementById(`app_t3_${username}`).value,
                published: document.getElementById(`app_pub_${username}`).checked
            };
            await DB.set('appreciations', appreciations);
            showToast("Enregistré", `Appréciations de ${username} enregistrées !`);
        }

        function renderAdminPages(customPages, hiddenPages) {
            const defaultPages = [
                { id: 'home', title: 'Accueil & QR Code' },
                { id: 'appreciations', title: 'Mes Appréciations' },
                { id: 'avatar', title: 'Mon Avatar' },
                { id: 'chat', title: 'Messagerie' },
                { id: 'calendar', title: 'Calendrier' },
                { id: 'quizzes', title: 'Quiz & Progrès' },
                { id: 'orientation', title: 'Orientation' },
                { id: 'revisions', title: 'Fiches de Révision' },
                { id: 'exams', title: 'Sujets Bac' },
                { id: 'notes', title: 'Bloc-Notes' }
            ];

            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="${window.currentCardClass} p-6 space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm">Créer une nouvelle page sur-mesure</h3>
                        <form onsubmit="createNewPage(event)" class="space-y-3">
                            <input type="text" id="newpage-title" required placeholder="Titre de la page..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="text" id="newpage-icon" placeholder="Icône FontAwesome (ex: book, star, trophy)..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <textarea id="newpage-content" required placeholder="Contenu HTML ou Texte..." class="w-full h-32 p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100"></textarea>
                            <button type="submit" class="w-full py-2.5 ${window.currentBtnClass} text-xs">Publier la page</button>
                        </form>
                    </div>

                    <div class="${window.currentCardClass} p-6 space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm">Masquer / Afficher les pages</h3>
                        <div class="space-y-2 max-h-80 overflow-y-auto">
                            ${defaultPages.map(p => `
                                <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                    <span>${p.title} <span class="text-[10px] text-amber-200/50">(Système)</span></span>
                                    <button onclick="toggleHidePage('${p.id}')" class="px-3 py-1 rounded-lg font-bold text-xs ${hiddenPages.includes(p.id) ? 'bg-red-600/30 text-red-300 border border-red-500/40' : 'bg-emerald-600/30 text-emerald-300 border border-emerald-500/40'}">
                                        ${hiddenPages.includes(p.id) ? 'Masquée' : 'Visible'}
                                    </button>
                                </div>`).join('')}
                            ${customPages.map(p => `
                                <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                    <span>${p.title}</span>
                                    <button onclick="toggleHidePage('page_${p.id}')" class="px-3 py-1 rounded-lg font-bold text-xs ${hiddenPages.includes('page_' + p.id) ? 'bg-red-600/30 text-red-300 border border-red-500/40' : 'bg-emerald-600/30 text-emerald-300 border border-emerald-500/40'}">
                                        ${hiddenPages.includes('page_' + p.id) ? 'Masquée' : 'Visible'}
                                    </button>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        async function createNewPage(e) {
            e.preventDefault();
            let title = document.getElementById('newpage-title').value;
            let icon = document.getElementById('newpage-icon').value || 'file-lines';
            let content = document.getElementById('newpage-content').value;

            let customPages = await DB.get('custom_pages', []);
            customPages.push({ id: Date.now(), title, icon, content });
            await DB.set('custom_pages', customPages);
            showToast("Succès", "Nouvelle page créée et intégrée au menu !");
            render();
        }

        async function toggleHidePage(pageId) {
            let hiddenPages = await DB.get('hidden_pages', []);
            if (hiddenPages.includes(pageId)) {
                hiddenPages = hiddenPages.filter(id => id !== pageId);
            } else {
                hiddenPages.push(pageId);
            }
            await DB.set('hidden_pages', hiddenPages);
            render();
        }

        function renderAdminThemes() {
            return `
                <div class="${window.currentCardClass} p-6 space-y-4 text-center">
                    <h3 class="font-bold text-amber-300 text-sm">Gestion des Thèmes & Canva</h3>
                    <p class="text-xs text-amber-200/70">Ouvre Canva pour créer ton fond d'écran sur mesure, puis colle l'URL de l'image pour l'appliquer à l'application.</p>
                    <div class="flex justify-center gap-3 pt-2">
                        <button onclick="toggleModal('theme-canvas-modal', true)" class="px-5 py-3 ${window.currentBtnClass} text-xs">
                            <i class="fa-solid fa-paintbrush mr-2"></i> Créer / Appliquer un fond Canva
                        </button>
                    </div>
                </div>`;
        }

        async function saveCanvasTheme() {
            let name = document.getElementById('canvas-theme-name').value;
            let bgUrl = document.getElementById('canvas-theme-bg').value;
            if(!name || !bgUrl) return alert("Veuillez remplir le nom et l'URL de l'image.");

            let customThemes = await DB.get('custom_themes', []);
            let themeId = 'custom_' + Date.now();
            customThemes.push({ id: themeId, name, bgUrl });
            await DB.set('custom_themes', customThemes);
            await DB.set('theme', themeId);

            toggleModal('theme-canvas-modal', false);
            applyTheme(themeId);
            showToast("Thème Appliqué", "Ton fond Canva personnalisé est configuré !");
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();

            let users = await DB.get('users', []);
            let user = users.find(x => x.username === u && x.password === p);

            if (user) {
                localStorage.setItem('leqg_current_user', JSON.stringify(user));
                render();
            } else {
                alert("Identifiant ou mot de passe incorrect");
            }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let pass = document.getElementById('s-pass').value;
            let bday = document.getElementById('s-bday').value;

            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);

            if (idx !== -1) {
                users[idx].password = pass;
                users[idx].birthday = bday;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        async function updateAvatar(icon) {
            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1) {
                users[idx].avatar = icon;
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() {
            localStorage.removeItem('leqg_current_user');
            render();
        }

        window.onload = init;
    </script>
</body>
</html>
